[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-ocean-tracer"
version = "0.1.0"
description = "Ensemble simulation framework for passive tracer transport in stochastic ocean velocity fields."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Oleksandr Shrubkovskyi" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.11",
  "matplotlib>=3.7",
  "PyYAML>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
